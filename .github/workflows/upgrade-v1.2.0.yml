name: Upgrade BilaScript v1.2.0 Native

on:
  push:
    branches:
      - Babylscript1_7R2_BRANCH
    paths:
      - '.github/workflows/upgrade-v1.2.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    name: Apply native bila upgrade / JDK 8
    runs-on: ubuntu-latest
    outputs:
      upgraded_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Apache Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Validate upgrader
        run: python3 -m py_compile scripts/upgrade_v1_2.py

      - name: Apply BilaScript v1.2.0 upgrade
        run: python3 scripts/upgrade_v1_2.py

      - name: Verify native core wiring
        run: |
          grep -F 'bila,' src/org/mozilla/javascript/TokenStream.java
          grep -F 'LanguageMode.bila' src/org/mozilla/javascript/BabylTokenizer.java
          grep -F 'createBilaTokenizer' src/org/mozilla/javascript/babylscript/BabylGenericTokenizer.java
          grep -F 'LanguageMode.bila' src/org/mozilla/javascript/babylscript/TranslatedNameBindings.java
          grep -F 'LANGUAGE_CODE = "bila"' src/org/mozilla/javascript/babylscript/gen/Cvnss40.java
          grep -F -- '---bila---' babylrunner/sample.bila.js

      - name: Build Runner and Babyl2JS
        run: |
          ant clean
          ant babylscriptrun
          ant babyl2js

      - name: Native runtime smoke test
        run: |
          java -jar build/babylscriptrun.jar babylrunner/sample.bila.js | tee build/v1.2-native-output.txt
          grep -F 'Xin chaol BilaScript' build/v1.2-native-output.txt
          grep -F 'Xin chaol CVNSS4.0' build/v1.2-native-output.txt
          grep -F 'Dof zail: 3' build/v1.2-native-output.txt

      - name: Native Babyl2JS smoke test
        run: |
          java -jar build/babyl2js.jar babylrunner/sample.bila.js build/sample.bila.compiled.js
          java -jar build/babyl2js.jar -html babylrunner/sample.bila.js build/sample.bila.html
          test -s build/sample.bila.compiled.js
          test -s build/sample.bila.html
          grep -F 'bila' build/sample.bila.compiled.js

      - name: Verify legacy ---cvss--- compatibility
        run: |
          java -jar build/babylscriptrun.jar babylrunner/sample.cvss.js | tee build/v1.2-legacy-output.txt
          grep -F 'Xin chaol BilaScript' build/v1.2-legacy-output.txt

      - name: Commit verified upgrade
        id: commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/bilascript-ci.yml babylrunner/Runner.java babylrunner/Babyl2JS.java babylrunner/sample.bila.js docs/BILASCRIPT_LANGUAGE_v1.2.0.md src/org/mozilla/javascript/TokenStream.java src/org/mozilla/javascript/BabylTokenizer.java src/org/mozilla/javascript/babylscript/BabylGenericTokenizer.java src/org/mozilla/javascript/babylscript/TranslatedNameBindings.java src/org/mozilla/javascript/babylscript/gen/Cvnss40.java
          git commit -m 'feat: BilaScript v1.2.0 native CVNSS4.0 language mode'
          git push origin HEAD:Babylscript1_7R2_BRANCH
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify-cross-platform:
    name: ${{ matrix.os }} / JDK 8 / native bila
    needs: upgrade
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout upgraded commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.upgrade.outputs.upgraded_sha }}

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Ant on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Install Ant on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install ant --no-progress -y

      - name: Build and test on Linux
        if: runner.os == 'Linux'
        run: |
          ant babylscriptrun
          ant babyl2js
          java -jar build/babylscriptrun.jar babylrunner/sample.bila.js | tee build/native-output.txt
          grep -F 'Dof zail: 3' build/native-output.txt
          java -jar build/babyl2js.jar babylrunner/sample.bila.js build/native.js
          grep -F 'bila' build/native.js

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ant babylscriptrun
          ant babyl2js
          $output = java -jar build/babylscriptrun.jar babylrunner/sample.bila.js
          $output | Tee-Object -FilePath build/native-output.txt
          if (-not ($output -match 'Dof zail: 3')) { throw 'Native Bila Array.length translation failed' }
          java -jar build/babyl2js.jar babylrunner/sample.bila.js build/native.js
          if (-not (Select-String -Path build/native.js -SimpleMatch 'bila')) { throw 'Compiler output is not native bila' }
