name: Finalize BilaScript v3.0.0

on:
  push:
    branches: [Babylscript1_7R2_BRANCH]
    paths:
      - tools/finalize_v3.py
      - .github/workflows/finalize-v3.0.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: Babylscript1_7R2_BRANCH
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Normalize README
        run: python tools/finalize_v3.py
      - name: Verify v3 core before retag
        working-directory: v3
        run: npm test
      - name: Verify README framing
        run: |
          grep -F 'BilaScript v3 Native Frontend CI' README.md
          grep -F 'release-v3.0.0-blue' README.md
          grep -F 'v3%20Core-MIT' README.md
          grep -F 'JavaScript là backend thực thi đầu tiên' README.md
      - name: Commit final README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git status --short
          if git diff --cached --quiet; then
            echo 'README already finalized'
          else
            git commit -m 'docs: finalize BilaScript v3 architecture and licensing'
            git push origin HEAD:Babylscript1_7R2_BRANCH
          fi
      - name: Move v3.0.0 tag to final commit
        run: |
          git tag -f v3.0.0 HEAD
          git push --force origin refs/tags/v3.0.0
