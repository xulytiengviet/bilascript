name: Publish BilaScript v4.0.0

on:
  push:
    branches: [Babylscript1_7R2_BRANCH]
    paths:
      - '.github/workflows/release-v4.0.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Test, package and publish v4.0.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: Babylscript1_7R2_BRANCH

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify v4 core and conformance
        working-directory: v4
        run: |
          npm install --no-save --no-package-lock 'typescript@5'
          npm test
          npm run conformance
          node -e "import('./src/typescript-oracle.js').then(async m=>{const r=await m.analyzeWithTypeScript('const x = ;');if(!r.available||!r.diagnostics.length)process.exit(2);console.log('TypeScript oracle',r.version)})"
          rm -rf node_modules

      - name: Verify strict zero-cost frontend
        run: |
          node v4/bin/bila.js compile v4/examples/hello.bila -o /tmp/bilascript-v4.js --map
          node /tmp/bilascript-v4.js
          if grep -E 'BilaRuntime|BilaArray|__bilaRuntime|__bilaGet|__bilaCall' /tmp/bilascript-v4.js; then
            echo 'Unexpected runtime helper detected'
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { compile } from './v4/src/compiler.js';
          let rejected=false;
          try { compile('---bila:strict---\nbilb x=unknown(); x.dayq(1);'); }
          catch(e) { rejected=/BILA-T310/.test(String(e.message)); }
          if(!rejected) process.exit(2);
          const r=compile('---bila:strict---\nbilb ds: Magz<Sob>=[1]; ds.dayq(2);');
          if(!r.performance.zeroCost || !/ds\.push\(2\)/.test(r.code)) process.exit(3);
          NODE

      - name: Prepare release assets
        run: |
          rm -rf release-dist
          mkdir -p release-dist/core release-dist/tooling release-dist/site-paper

          cp -R v4/src v4/bin v4/examples v4/test v4/conformance release-dist/core/
          cp v4/package.json v4/LICENSE v4/README.md v4/PERFORMANCE_CONTRACT.md release-dist/core/

          cp -R v4/tools v4/editors release-dist/tooling/
          cp v4/src/language-service.js v4/src/typescript-oracle.js v4/src/source-map.js release-dist/tooling/
          cp docs/BILASCRIPT_v4.0.0.md v4/docs/LOOP4_AUDIT_v4.0.0.md release-dist/tooling/

          cp index.html release-dist/site-paper/
          cp docs/BILASCRIPT_v4.0.0.md docs/SCIENTIFIC_EVALUATION_v4.0.0.md v4/docs/LOOP4_AUDIT_v4.0.0.md release-dist/site-paper/

          (cd release-dist/core && zip -qr ../BilaScript-v4.0.0-Core.zip .)
          (cd release-dist/tooling && zip -qr ../BilaScript-v4.0.0-Tooling.zip .)
          (cd release-dist/site-paper && zip -qr ../BilaScript-v4.0.0-Site-and-Paper.zip .)
          cd release-dist
          sha256sum BilaScript-v4.0.0-Core.zip BilaScript-v4.0.0-Tooling.zip BilaScript-v4.0.0-Site-and-Paper.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release notes
        run: |
          cat > release-dist/RELEASE_NOTES.md <<'EOF'
          # BilaScript v4.0.0 — Evidence-driven Zero-cost CVNSS4.0 Frontend

          **BilaScript làm chủ frontend; JavaScript đảm nhiệm runtime.**

          V4.0.0 hoàn tất bốn vòng hardening có test gate:

          1. **Compile-time Safety** — strict unknown built-in alias trở thành `BILA-T310`; type annotations như `Magz<Sob>` cung cấp bằng chứng và bị xóa trước codegen.
          2. **Tooling & Language Service** — diagnostics/completion/hover/symbols, minimal LSP và TypeScript oracle offline tùy chọn. TypeScript không phải semantic authority của Bila.
          3. **Modern JavaScript Grammar** — class, ESM import/export, destructuring, async/await structural support; arrow/optional/nullish/spread/template giữ structural syntax JavaScript.
          4. **Conformance Hardening** — positive/negative corpus, deterministic operator differential tests, zero-helper audit và source-map checks.

          ## Zero-cost contract
          CVNSS4.0 được xử lý ở compile-time. Với mapping 1:1, output là JavaScript trực tiếp; compiler không chèn Bila runtime translator, collection wrapper hoặc semantic proxy.

          ## Alias boundary
          - Language vocabulary: Bila/CVNSS4.0 frontend.
          - Proven JavaScript built-ins: có thể lower compile-time.
          - Unknown receiver trong `bila:strict`: compile error.
          - User-defined/npm API: không tự động bản địa hóa.

          ## Phạm vi trung thực
          V4.0.0 **không** tuyên bố full ECMAScript/Test262 conformance và **không** tuyên bố nhanh hơn JavaScript. Template interpolation hiện là structural passthrough; CVNSS4.0 alias bên trong `${...}` chưa được semantic lowering.

          ## License & credit
          **BilaScript v4 Core — MIT License — Copyright © 2026 Long Ngo — phát triển dựa trên CVNSS4.0.**

          Legacy Rhino/Babylscript ngoài modern core tiếp tục giữ giấy phép upstream tương ứng.
          EOF

      - name: Publish tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v4.0.0 >/dev/null 2>&1; then
            gh release delete v4.0.0 --yes --cleanup-tag
          fi
          gh release create v4.0.0 \
            release-dist/BilaScript-v4.0.0-Core.zip \
            release-dist/BilaScript-v4.0.0-Tooling.zip \
            release-dist/BilaScript-v4.0.0-Site-and-Paper.zip \
            release-dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'BilaScript v4.0.0 — Evidence-driven Zero-cost CVNSS4.0 Frontend' \
            --notes-file release-dist/RELEASE_NOTES.md

      - name: Verify uploaded assets and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf release-verify
          mkdir release-verify
          cd release-verify
          gh release download v4.0.0 --repo "$GITHUB_REPOSITORY"
          sha256sum -c SHA256SUMS.txt
          test -f BilaScript-v4.0.0-Core.zip
          test -f BilaScript-v4.0.0-Tooling.zip
          test -f BilaScript-v4.0.0-Site-and-Paper.zip
