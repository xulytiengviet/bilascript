name: Publish BilaScript v1.0.0

on:
  push:
    branches:
      - Babylscript1_7R2_BRANCH
    paths:
      - .github/workflows/release-v1.0.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, checksum and publish v1.0.0
    runs-on: ubuntu-latest
    env:
      TAG: v1.0.0
      VERSION: 1.0.0
      BRANCH: Babylscript1_7R2_BRANCH
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Apache Ant and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y ant zip

      - name: Show toolchain
        run: |
          java -version
          javac -version
          ant -version
          gh --version

      - name: Build Runner and Babyl2JS
        run: |
          ant clean
          ant babylscriptrun
          ant babyl2js
          test -s build/babylscriptrun.jar
          test -s build/babyl2js.jar

      - name: Smoke-test CVNSS4.0 runtime
        run: |
          java -jar build/babylscriptrun.jar babylrunner/sample.cvss.js | tee build/release-smoke-test.txt
          grep -F 'Xin chaol BilaScript' build/release-smoke-test.txt
          grep -F 'Xin chaol CVNSS4.0' build/release-smoke-test.txt

      - name: Smoke-test Babyl2JS compiler
        run: |
          java -jar build/babyl2js.jar babylrunner/sample.cvss.js build/release-sample.js
          java -jar build/babyl2js.jar -html babylrunner/sample.cvss.js build/release-sample.html
          test -s build/release-sample.js
          test -s build/release-sample.html
          grep -F 'function' build/release-sample.js

      - name: Prepare v1.0.0 release assets
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_DIR="$GITHUB_WORKSPACE/release"
          WINDOWS_ROOT="$RELEASE_DIR/windows/BilaScript-v${VERSION}"
          mkdir -p "$WINDOWS_ROOT"

          cp build/babylscriptrun.jar "$RELEASE_DIR/BilaScript-v${VERSION}-Runner.jar"
          cp build/babyl2js.jar "$RELEASE_DIR/BilaScript-v${VERSION}-Babyl2JS.jar"

          cp "$RELEASE_DIR/BilaScript-v${VERSION}-Runner.jar" "$WINDOWS_ROOT/"
          cp "$RELEASE_DIR/BilaScript-v${VERSION}-Babyl2JS.jar" "$WINDOWS_ROOT/"
          cp babylrunner/sample.cvss.js "$WINDOWS_ROOT/sample.cvss.js"
          cp LICENSE.txt "$WINDOWS_ROOT/LICENSE.txt"

          cat > "$WINDOWS_ROOT/RUN-SAMPLE.cmd" <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"
          java -jar BilaScript-v1.0.0-Runner.jar sample.cvss.js
          echo.
          pause
          EOF

          cat > "$WINDOWS_ROOT/COMPILE-SAMPLE.cmd" <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"
          java -jar BilaScript-v1.0.0-Babyl2JS.jar sample.cvss.js sample.compiled.js
          java -jar BilaScript-v1.0.0-Babyl2JS.jar -html sample.cvss.js sample.html
          echo Da tao sample.compiled.js va sample.html
          echo.
          pause
          EOF

          cat > "$WINDOWS_ROOT/README-WINDOWS.txt" <<'EOF'
          BILASCRIPT v1.0.0 - WINDOWS QUICK START
          ======================================

          Yeu cau: Java 8 (JRE hoac JDK) co lenh java trong PATH.

          1. Chay sample CVNSS4.0:
             RUN-SAMPLE.cmd

          2. Dich sample sang JavaScript va HTML:
             COMPILE-SAMPLE.cmd

          Lenh truc tiep:
             java -jar BilaScript-v1.0.0-Runner.jar sample.cvss.js
             java -jar BilaScript-v1.0.0-Babyl2JS.jar sample.cvss.js output.js
             java -jar BilaScript-v1.0.0-Babyl2JS.jar -html sample.cvss.js output.html

          BilaScript ke thua: Mozilla Rhino 1.7R2 -> Babylscript -> BilaScript CVNSS4.0.
          EOF

          (
            cd "$RELEASE_DIR/windows"
            zip -r "../BilaScript-v${VERSION}-Windows-x64.zip" "BilaScript-v${VERSION}"
          )

          rm -rf "$RELEASE_DIR/windows"

          (
            cd "$RELEASE_DIR"
            sha256sum \
              "BilaScript-v${VERSION}-Runner.jar" \
              "BilaScript-v${VERSION}-Babyl2JS.jar" \
              "BilaScript-v${VERSION}-Windows-x64.zip" \
              > SHA256SUMS.txt
          )

          echo '=== Release assets ==='
          ls -lh "$RELEASE_DIR"
          echo '=== SHA-256 ==='
          cat "$RELEASE_DIR/SHA256SUMS.txt"

      - name: Add build-passing and release badges to README
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          ci = '[![BilaScript CVNSS4.0 CI](https://github.com/xulytiengviet/bilascript/actions/workflows/bilascript-ci.yml/badge.svg?branch=Babylscript1_7R2_BRANCH)](https://github.com/xulytiengviet/bilascript/actions/workflows/bilascript-ci.yml)'
          release = '[![Release v1.0.0](https://img.shields.io/badge/release-v1.0.0-blue)](https://github.com/xulytiengviet/bilascript/releases/tag/v1.0.0)'

          additions = []
          if ci not in text:
              additions.append(ci)
          if release not in text:
              additions.append(release)

          if additions:
              lines = text.splitlines()
              insert_at = 1 if lines else 0
              lines[insert_at:insert_at] = ['', *additions]
              path.write_text('\n'.join(lines) + ('\n' if text.endswith('\n') else ''), encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: add build passing and v1.0.0 release badges'
            git push origin "HEAD:${BRANCH}"
          fi

      - name: Publish GitHub Release v1.0.0
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          TITLE='BilaScript v1.0.0 — CVNSS4.0 JavaScript/ECMAScript'

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "release/BilaScript-v${VERSION}-Runner.jar" \
              "release/BilaScript-v${VERSION}-Babyl2JS.jar" \
              "release/BilaScript-v${VERSION}-Windows-x64.zip" \
              "release/SHA256SUMS.txt" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file docs/RELEASE_v1.0.0.md \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              "release/BilaScript-v${VERSION}-Runner.jar" \
              "release/BilaScript-v${VERSION}-Babyl2JS.jar" \
              "release/BilaScript-v${VERSION}-Windows-x64.zip" \
              "release/SHA256SUMS.txt" \
              --target "$TARGET_SHA" \
              --title "$TITLE" \
              --notes-file docs/RELEASE_v1.0.0.md \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Verify uploaded release checksums
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verify-release
          mkdir verify-release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir verify-release
          (
            cd verify-release
            sha256sum -c SHA256SUMS.txt
          )
          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,isDraft,isPrerelease,url,assets
