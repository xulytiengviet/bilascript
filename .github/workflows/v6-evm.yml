name: BilaScript v6 Native EVM Conformance
on:
  push:
    paths:
      - 'v6/**'
      - '.github/workflows/v6-evm.yml'
  pull_request:
    paths:
      - 'v6/**'
      - '.github/workflows/v6-evm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiler-and-local-evm:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests (Keccak, grammar, assembly, ABI)
        run: node --test v6/test/compiler.test.mjs
      - name: Browser module syntax
        run: |
          node --check v6/compiler.mjs
          node --check v6/app.mjs
          node --check v6/sepolia-proof.mjs
          node --check v6/wallet-adapter.mjs
          node --check v6/faucet.mjs
          node --check v6/deployment-ready.mjs
          node --check v6/token/token-lab.mjs
          node --check v6/provenance.mjs
      - name: EIP-6963/EIP-1193 wallet adapter unit tests
        run: node --test v6/test/wallet-adapter.test.mjs
      - name: Sepolia faucet registry and fail-closed RPC tests
        run: node --test v6/test/faucet.test.mjs
      - name: Real ETH and gas readiness regression
        run: node --test v6/test/deployment-ready.test.mjs
      - name: ERC20 reference artifact and Sepolia proof validator tests
        run: node --test v6/token/token-lab.test.mjs
      - name: Compiler provenance exact native-versus-Solc classification regression
        run: node --test v6/test/provenance.test.mjs
      - name: Verify Sepolia evidence security checks (fixtures, not public deployment)
        run: node --test v6/test/sepolia-proof.test.mjs
      - name: Install pinned solc-js differential oracle (not used for BilaScript codegen)
        run: npm install --no-save --no-package-lock --ignore-scripts solc@0.8.30 jsdom@26.1.0 @openzeppelin/contracts@5.6.1
      - name: Compare selectors, ABI and storage layout against Argot solc-js
        run: node --test v6/test/solc-oracle.test.mjs
      - name: Verify committed BILA token build against deterministic Solc/OpenZeppelin compiler
        env:
          VERIFY_COMMITTED_TOKEN_BUILD: '1'
        run: node v6/token/build-token.mjs
      - name: Browser smoke — real app DOM and injected-wallet click flow
        run: node --test v6/test/browser-smoke.mjs
      - name: Install real Foundry EVM toolchain
        uses: foundry-rs/foundry-toolchain@v1
      - name: Anvil EVM deploy and state transition (no mock)
        run: bash v6/test/anvil.sh
      - name: Differential fuzzing — BilaScript vs Solc on real Anvil
        id: differential
        env:
          FUZZ_START: '20261024'
          FUZZ_SEEDS: '24'
          FUZZ_STEPS: '14'
        run: bash v6/test/differential-anvil.sh
      - name: Retain reproducible seeds, state traces and failure counterexamples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilascript-v6-differential-evidence
          path: v6/test-results/differential-fuzz.json
          if-no-files-found: warn
          retention-days: 30

